name: Update Protobuf

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  update-protobuf:
    name: Update geoip.pb.go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Install protoc
        run: |
          PROTOC_VERSION=36.1
          curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip
          sudo unzip -o protoc-${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local 'include/*'
          rm -f protoc-${PROTOC_VERSION}-linux-x86_64.zip
          protoc --version

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12

      - name: Generate geoip.pb.go
        run: |
          cd plugin/v2ray
          protoc --go_out=. --go_opt=paths=source_relative geoip.proto

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/v2ray/geoip.pb.go
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Chore: update geoip.pb.go from proto file"
            git push
          fi
